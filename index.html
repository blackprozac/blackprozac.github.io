  <style>
    /* Background container covering entire viewport */
    #bg-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      opacity: 0.3; /* overall background opacity */
      transition: background-color 0.4s ease;
    }

    /* White overlay to create dip effect */
    #white-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <div id="bg-container"></div>
  <div id="white-overlay"></div>

  <div class="content">
    <h1 class="logo"><a href="index.html">blackprozac</a></h1>
    <nav class="links">
      <a href="photography/photography.html">.photography</a>
      <a href="https://204609.xyz/" target="_blank">.art</a>
      <a href="https://soundcloud.com/blackprozac" target="_blank">.music</a>
      <a href="https://dotbubble.xyz/" target="_blank">.clothing</a>
      <a href="https://0066700.xyz/microblog">.frequent thoughts</a>
      <a href="https://instagram.com/blackprozac" target="_blank">.instagram</a>
    </nav>
  </div>

  <script>
    (function(){
      const bgContainer = document.getElementById('bg-container');
      const whiteOverlay = document.getElementById('white-overlay');

      const images = [
        'bg1.png',
        'bg2.png',
        'bg3.png',
        'bg4.png',
        'bg5.png',
        'bg6.png'
      ];

      let index = 0;
      const displayDuration = 1600; // 2 seconds
      const transitionDuration = 400; // 0.4 seconds fade

      function fadeToWhite() {
        return new Promise(resolve => {
          whiteOverlay.style.opacity = '1';
          setTimeout(resolve, transitionDuration);
        });
      }

      function fadeFromWhite() {
        return new Promise(resolve => {
          whiteOverlay.style.opacity = '0';
          setTimeout(resolve, transitionDuration);
        });
      }

      function showImage(idx) {
        bgContainer.style.backgroundImage = `url(${images[idx]})`;
      }

      async function next() {
        await fadeToWhite();
        index = (index + 1) % images.length;
        showImage(index);
        await fadeFromWhite();
        setTimeout(next, displayDuration);
      }

      // Initial setup
      showImage(index);
      setTimeout(next, displayDuration);
    })();
  </script>
</body>
