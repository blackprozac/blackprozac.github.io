<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="/favicon.ico" />

  <link rel="manifest" href="/site.webmanifest" />
  <style>
    /* Overlay full screen, invisible but clickable */
    #video-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: transparent;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;"
  >
    <source src="website-bg.mp4" type="video/mp4" />
  </video>

  <div class="content">
    <h1 class="logo"><a href="index.html">blackprozac</a></h1>
    <nav class="links">
      <a href="photography/photography.html">.photography</a>
      <a href="https://204609.xyz/" target="_blank">.art</a>
      <a href="https://soundcloud.com/blackprozac" target="_blank">.music</a>
      <a href="https://dotbubble.xyz/" target="_blank">.clothing</a>
      <a href="https://0066700.xyz/microblog">.frequent thoughts</a>
      <a href="https://instagram.com/blackprozac" target="_blank">.instagram</a>
    </nav>
  </div>

  <!-- The overlay div for user interaction on iOS if autoplay fails -->
  <div id="video-overlay" aria-label="Tap to play background video" role="button" tabindex="0"></div>

  <script>
    const video = document.getElementById('bg-video');
    const overlay = document.getElementById('video-overlay');

    // Ensure video is muted
    video.muted = true;

    // Try to autoplay
    video.play().catch(() => {
      // Autoplay failed, show overlay (should already be visible)
      overlay.style.display = 'block';
    });

    // On user tap or key press on overlay, play video and hide overlay
    function startVideo() {
      video.play().then(() => {
        overlay.style.display = 'none';
      }).catch(() => {
        // Still failed — do nothing or maybe notify user
      });
    }

    overlay.addEventListener('click', startVideo);
    overlay.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startVideo();
      }
    });

    // Initially hide overlay if autoplay succeeds immediately
    video.onplaying = () => {
      overlay.style.display = 'none';
    };
  </script>
</body>
</html>
